<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÆMA® - E-commerce Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/font.css">
    <style>
        * {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .hero-section {
            background: linear-gradient(to bottom, #e8e8e8 0%, #f5f5f5 100%);
        }
    </style>
</head>
<body class="bg-white">
    <!-- Top Bar -->
    <div class="bg-black text-white">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center text-sm">
            <div class="flex items-center gap-2">
                <span class="text-red-600">🇩🇪</span>
                <span class="font-light tracking-wide">GERMANY (EUR)</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="#" class="hover:text-gray-300 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </a>
                <a href="#" class="hover:text-gray-300 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </a>
                <a href="#" class="hover:text-gray-300 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 6c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z"/></svg>
                </a>
                <a href="#" class="hover:text-gray-300 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.162-.105-.949-.199-2.403.041-3.439.219-.937 1.406-5.957 1.406-5.957s-.359-.72-.359-1.781c0-1.663.967-2.911 2.168-2.911 1.024 0 1.518.769 1.518 1.688 0 1.029-.653 2.567-.992 3.992-.285 1.193.6 2.165 1.775 2.165 2.128 0 3.768-2.245 3.768-5.487 0-2.861-2.063-4.869-5.008-4.869-3.41 0-5.409 2.562-5.409 5.199 0 1.033.394 2.143.889 2.741.099.12.112.225.085.345-.09.375-.293 1.199-.334 1.363-.053.225-.172.271-.401.165-1.495-.69-2.433-2.878-2.433-4.646 0-3.776 2.748-7.252 7.92-7.252 4.158 0 7.392 2.967 7.392 6.923 0 4.135-2.607 7.462-6.233 7.462-1.214 0-2.354-.629-2.758-1.379l-.749 2.848c-.269 1.045-1.004 2.352-1.498 3.146 1.123.345 2.306.535 3.55.535 6.607 0 11.985-5.365 11.985-11.987C23.97 5.39 18.592.026 11.985.026L12.017 0z"/></svg>
                </a>
                <a href="#" class="hover:text-gray-300 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="text-2xl font-light tracking-wider">ÆMA®</div>

                <!-- Right Icons -->
                <div class="flex items-center divide-x divide-gray-200">
                    <a href="#" class="px-6 py-4 hover:bg-gray-50 transition flex items-center gap-2">
                        <span class="text-sm font-light tracking-wide">CART (0)</span>
                    </a>
                    <a href="#" class="px-6 py-4 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </a>
                    <a href="#" class="px-6 py-4 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    </a>
                    <a href="#" class="px-6 py-4 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </a>
                    <button class="px-6 py-4 hover:bg-gray-50 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section relative">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 min-h-[600px]">
                <!-- Left Content -->
                <div class="lg:col-span-3 flex flex-col justify-center py-12">
                    <h1 class="text-5xl font-light tracking-wide mb-8 leading-tight">
                        SUMMER<br>COLLECTION
                    </h1>
                    <a href="#" class="inline-block text-sm font-light tracking-widest border-b border-black pb-1 hover:opacity-70 transition w-fit">
                        SHOP NOW
                    </a>
                </div>

                <!-- Center Image -->
                <div class="lg:col-span-7 flex items-end justify-center">
                    <div class="w-full h-[600px] bg-gradient-to-b from-gray-200 to-gray-300 flex items-end justify-center overflow-hidden">
                        <div class="text-center text-gray-400 mb-8">Hero Image</div>
                    </div>
                </div>

                <!-- Right Thumbnails -->
                <div class="lg:col-span-2 flex flex-col gap-4 justify-center py-12">
                    <div class="aspect-square bg-gradient-to-br from-gray-200 to-gray-300 rounded-sm hover:opacity-80 transition cursor-pointer flex items-center justify-center text-gray-400 text-xs">Look 1</div>
                    <div class="aspect-square bg-gradient-to-br from-gray-100 to-gray-200 rounded-sm hover:opacity-80 transition cursor-pointer flex items-center justify-center text-gray-400 text-xs">Look 2</div>
                    <div class="aspect-square bg-gradient-to-br from-gray-300 to-gray-400 rounded-sm hover:opacity-80 transition cursor-pointer flex items-center justify-center text-gray-400 text-xs">Look 3</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Category Tabs -->
    <div class="border-t border-gray-200">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-3 text-center">
                <button class="py-6 text-sm font-light tracking-widest bg-black text-white transition hover:bg-gray-900">
                    NEW
                </button>
                <button class="py-6 text-sm font-light tracking-widest hover:bg-gray-50 transition border-l border-r border-gray-200">
                    BEST SELLERS
                </button>
                <button class="py-6 text-sm font-light tracking-widest hover:bg-gray-50 transition">
                    SALE
                </button>
            </div>
        </div>
    </div>

    <!-- Products Grid -->
    <section class="bg-white">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-2 border-t border-gray-200">
                <!-- Product 1 -->
                <div class="border-b border-r border-gray-200 p-8 relative group">
                    <div class="absolute top-8 left-8 border border-black px-3 py-1 text-xs font-light tracking-wide bg-white z-10">
                        NEW
                    </div>
                    <button class="absolute top-8 right-8 p-2 hover:bg-gray-100 rounded-full transition z-10">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    </button>
                    <div class="aspect-square bg-white flex items-center justify-center mb-6 overflow-hidden">
                        <div class="w-full h-full bg-gradient-to-br from-gray-900 to-black flex items-center justify-center text-white">
                            T-Shirt Image
                        </div>
                    </div>
                    <h3 class="text-sm font-light tracking-widest mb-2">T-SHIRT BLACK</h3>
                    <p class="text-sm font-light">19,90 EUR</p>
                </div>

                <!-- Product 2 -->
                <div class="border-b border-gray-200 p-8 relative group">
                    <button class="absolute top-8 right-8 p-2 hover:bg-gray-100 rounded-full transition z-10">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    </button>
                    <div class="aspect-square bg-white flex items-center justify-center mb-6 overflow-hidden">
                        <div class="w-full h-full bg-gradient-to-br from-blue-300 to-blue-400 flex items-center justify-center text-white">
                            Jeans Image
                        </div>
                    </div>
                    <h3 class="text-sm font-light tracking-widest mb-2">JEANS BLUE</h3>
                    <p class="text-sm font-light">49,90 EUR</p>
                </div>
            </div>

            <!-- Category Banner -->
            <div class="border-t border-b border-gray-200 py-16 text-center">
                <h2 class="text-2xl font-light tracking-widest text-gray-900">PANTS</h2>
            </div>
        </div>
    </section>
</body>
</html>
